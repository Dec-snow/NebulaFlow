services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula
      POSTGRES_DB: nebula
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: ghcr.io/dec-snow/nebulaflow:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NEBULA_ENV: production
      NEBULA_HTTP_ADDR: ":8080"
      NEBULA_PG_DSN: "postgres://nebula:nebula@postgres:5432/nebula?sslmode=disable"
      NEBULA_REDIS_ADDR: "redis:6379"
      NEBULA_JWT_SECRET: "change-me-in-production-please"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
