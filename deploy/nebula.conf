# nebula.hoarfrost.cloud —— 静态前端 + Go 后端 API
#
# 安装位置：/etc/nginx/conf.d/nebula.conf（CI 会 scp 到 /tmp 再 cp 到这里，然后 nginx -t && nginx -s reload）
#
# 形态：前端仍然是版本化目录 + 软链（/var/www/nebula/current），
# 后端是一个 systemd 常驻的 Go 进程，监听 **127.0.0.1:18080**。
#
# 为什么是 18080 而不是 8080：这台服务器上 nginx 自己有一个 vhost
# （/etc/nginx/sites-available/blog）已经 listen 0.0.0.0:8080，
# 而 0.0.0.0:8080 覆盖了回环地址，后端连 127.0.0.1:8080 都绑不上（实测 EADDRINUSE）。
# 端口定义在 /opt/nebulaflow/.env 的 PORT 里，改这里要同步改那边。
#
# ⚠ 证书部分由 Certbot 管理（见下面 managed by Certbot 的两段 + 80 端口那个 server）。
# 本文件是**整份覆盖**安装的，所以任何 Certbot 的改动都必须能在这里找到，
# 否则下次 CI 覆盖时会丢。当前 Certbot 只用了 webroot 方式的续期定时器
# （/etc/letsencrypt/renewal/*.conf 里的 webroot 路径），不依赖本文件里的额外 location。

server {
    if ($host = nebula.hoarfrost.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name nebula.hoarfrost.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nebula.hoarfrost.cloud;
    ssl_certificate /etc/letsencrypt/live/nebula.hoarfrost.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nebula.hoarfrost.cloud/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/nebula/current;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # ---------- 后端 API 反代 ----------
    #
    # 用 ^~ 而不是普通前缀：下面有一条正则 location 匹配 .js/.css/... 之类的后缀，
    # nginx 的匹配顺序是「先全部前缀，记住最长的那个；再按顺序试正则；
    # 正则命中就覆盖前缀」。所以没有 ^~ 的话，一次 /api/xxx.json 的请求
    # 会被当成静态资源去 current/ 目录里找，直接 404 —— 这种问题只在个别路径上出现，
    # 排查起来非常费时，所以这里一次性钉死。
    #
    # proxy_pass 末尾的 /api/ 必须和 location 的 /api/ 一致：
    # 带 URI 的 proxy_pass 会把匹配到的前缀替换成这里的 URI，
    # 两边都是 /api/ 即"原样透传"。写成 http://127.0.0.1:18080/ （少一层）
    # 会把 /api 前缀剥掉，后端所有路由都不匹配，全部 404。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---------- SSE 必需的三行（任务详情 /api/tasks/:id/stream） ----------
        # 这三行缺一不可，缺了的表现都是"前端一直转圈、最后超时"：
        #   1. HTTP/1.0 默认带 Connection: close，SSE 会被立刻断掉，必须升到 1.1；
        #   2. 上面升级到 1.1 后，nginx 默认会塞 Connection: close（因为 Keep-Alive 头
        #      不会被转发给上游），显式置空让连接保持到最后一条事件；
        #   3. 不关 proxy_buffering 的话，nginx 会攒够一个 buffer 才吐给客户端，
        #      流式输出的"逐字"效果变成"一次性蹦出一整段"。
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;

        # 任务详情 SSE 是长连接：后端默认不主动断开，靠事件推完或客户端断开。
        # 用 1 小时（对齐 wb.conf 里同一个套路），而不是 60s —— 60s 会让
        # 一个正在跑的长任务在流中途被掐断。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 知识库文档上传：nginx 默认 client_max_body_size 1m，
        # 会把稍大的简历/JD 文件在到达 Go 之前就 413 掉（前端只看到"上传失败"）。
        client_max_body_size 64m;

        # 反代的目标是确切的进程，失败就明确报 502，别落到静态站上返回 index.html
        # —— "API 挂了但前端还在" 时必须一眼看出来，而不是拿到一个 200 的 HTML。
        proxy_intercept_errors off;
    }

    # ---------- 健康检查 ----------
    # 与 /api/ 分开：这个路径是给 CI 与运维探活用的（后端 /healthz 返回 200 + JSON），
    # 走同一个反代规则，但独立成一条便于以后单独收紧（例如只允许内网源 IP）。
    location = /healthz {
        proxy_pass http://127.0.0.1:18080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 10s;
        access_log off;
    }

    # HTML 不缓存，确保每次部署都能拿到最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长期缓存（Vite 构建会自动加 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }
}
