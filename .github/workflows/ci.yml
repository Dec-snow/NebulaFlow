# NebulaFlow CI/CD —— push/PR 触发
# 流水线：Lint → Unit Test → Frontend Build → Deploy (tar.gz over SSH)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -cover ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Frontend build
        working-directory: web-next
        run: |
          npm ci
          npm run build

      - name: Package frontend
        run: tar -czf frontend.tar.gz -C web-next/dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend.tar.gz
          retention-days: 7

  deploy:
    name: Deploy (ssh)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: frontend.tar.gz
          target: /tmp

      - name: Copy nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: deploy/nebula.conf
          target: /tmp

      - name: Deploy over SSH (versioned release + symlink)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail

            RELEASES_DIR="/var/www/nebula/releases"
            CURRENT_LINK="/var/www/nebula/current"
            VERSION=$(date +%Y%m%d-%H%M%S)
            RELEASE_DIR="${RELEASES_DIR}/${VERSION}"

            # 1. 准备版本目录
            mkdir -p "${RELEASE_DIR}"

            # 2. 解压新版本
            tar -xzf /tmp/frontend.tar.gz -C "${RELEASE_DIR}"
            rm /tmp/frontend.tar.gz

            # 3. 更新软链接（原子切换）
            #    先建临时链接再 rename，避免 current 短暂不存在
            ln -sfn "${RELEASE_DIR}" "${CURRENT_LINK}.tmp"
            mv -T "${CURRENT_LINK}.tmp" "${CURRENT_LINK}"

            # 4. 保留最近 5 个版本，旧的删除
            cd "${RELEASES_DIR}"
            ls -t | tail -n +6 | xargs -r rm -rf

            # 5. 同步 nginx 配置（root 指向 current 软链接）并 reload
            cp /tmp/nebula.conf /etc/nginx/conf.d/nebula.conf
            rm -f /tmp/nebula.conf
            nginx -t && nginx -s reload

            echo "deploy ok: ${VERSION}"
