# NebulaFlow CI/CD —— push/PR 触发
# 流水线：Lint → Unit Test → Frontend Build → Deploy (tar.gz over SSH)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    # PG 服务是本次新增的：internal/store 的知识库/任务 SQL 长期零 PG 覆盖，
    # 于是 documents.chunks/size_kb/error_message 三列从没进过 001_init.sql、
    # KeywordSearch 引用了 document_chunks.knowledge_base_id 与 documents.indexed
    # 两个不存在的列、CreateTask 整条 INSERT 漏了 priority——全部只在 PG 模式下炸，
    # 内存实现的单测一路全绿。起一个真库跑集成用例，这类漂移才拦得住。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nebula
          POSTGRES_PASSWORD: nebula
          POSTGRES_DB: nebulaflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nebula -d nebulaflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -cover ./...

      # 这里曾经有一段 psql bootstrap：先把 agent_memory.embedding_v 建成 vector(384)，
      # 绕过「004 在无维度 vector 列上建 HNSW 索引导致空库迁移失败」这个缺陷。
      # 缺陷本身已修（HNSW 索引改由 Go 侧 EnsureVectorSchema 按 EMBED_DIM 建），
      # 绕过去就等于永远测不到，所以整段删除——现在由
      # internal/database 的 TestMigrateOnBrandNewDatabase 在一个全新库上把迁移跑通。
      # 集成用例：默认在没有 NEBULA_TEST_DSN 时 skip，这里显式给 DSN 让它们真跑。
      # MultiTenant 用例会造 5 万分块 / 20 个知识库来验证 HNSW 全局索引下的召回
      # （规模不够时规划器不会选 HNSW，用例会因「前提不成立」失败而不是静默通过），
      # 所以这一步大约 3 分钟。
      - name: Go integration tests (real PostgreSQL + pgvector)
        env:
          NEBULA_TEST_DSN: "postgres://nebula:nebula@127.0.0.1:5432/nebulaflow?sslmode=disable"
        run: |
          go test ./internal/store/... \
            -run 'MultiTenant|Knowledge|Document|TaskPriority|Hybrid' \
            -v -count=1

      # 空库迁移必须一次跑通：上面那段 bootstrap 掩盖的正是这条路径。
      - name: Go migration test on a brand-new database
        env:
          NEBULA_TEST_DSN: "postgres://nebula:nebula@127.0.0.1:5432/nebulaflow?sslmode=disable"
        run: |
          go test ./internal/database/... -run 'BrandNewDatabase' -v -count=1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Frontend build
        working-directory: web-next
        # 部署目标（nebula.hoarfrost.cloud）是**纯静态展示站**：那台服务器上没有 Go 后端，
        # 且 deploy/nebula.conf 只做静态托管（没有 /api 反代 —— 实测 /api/* 会回落到 index.html、
        # POST /api/auth/login 返回 nginx 405）。所以线上刻意以 mock 模式构建，保证演示站始终可浏览。
        #
        # 想让线上跑真实 API，先满足两件事（详见 PR #2 的“部署注意”）：
        #   1. 在服务器上跑后端（docker compose 的 app 服务，或直接跑二进制，默认 :8080）；
        #   2. 给 deploy/nebula.conf 加 location /api/ 反代，可直接抄 web-next/nginx.conf，
        #      注意其中 SSE 的三行：proxy_http_version 1.1 / proxy_set_header Connection "" / proxy_buffering off。
        # 两者就绪后，把下面的 VITE_USE_MOCK 删掉即可切回真实 API。
        env:
          VITE_USE_MOCK: "true"
        run: |
          npm ci
          npm run build

      - name: Package frontend
        run: tar -czf frontend.tar.gz -C web-next/dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend.tar.gz
          retention-days: 7

  deploy:
    name: Deploy (ssh)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: frontend.tar.gz
          target: /tmp

      - name: Copy nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: deploy/nebula.conf
          target: /tmp
          strip_components: 1

      - name: Deploy over SSH (versioned release + symlink)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail

            RELEASES_DIR="/var/www/nebula/releases"
            CURRENT_LINK="/var/www/nebula/current"
            VERSION=$(date +%Y%m%d-%H%M%S)
            RELEASE_DIR="${RELEASES_DIR}/${VERSION}"

            # 1. 准备版本目录
            mkdir -p "${RELEASE_DIR}"

            # 2. 解压新版本
            tar -xzf /tmp/frontend.tar.gz -C "${RELEASE_DIR}"
            rm /tmp/frontend.tar.gz

            # 3. 更新软链接（原子切换）
            #    先建临时链接再 rename，避免 current 短暂不存在
            ln -sfn "${RELEASE_DIR}" "${CURRENT_LINK}.tmp"
            mv -T "${CURRENT_LINK}.tmp" "${CURRENT_LINK}"

            # 4. 保留最近 5 个版本，旧的删除
            cd "${RELEASES_DIR}"
            ls -t | tail -n +6 | xargs -r rm -rf

            # 5. 同步 nginx 配置（root 指向 current 软链接）并 reload
            cp /tmp/nebula.conf /etc/nginx/conf.d/nebula.conf
            rm -f /tmp/nebula.conf
            nginx -t && nginx -s reload

            echo "deploy ok: ${VERSION}"
