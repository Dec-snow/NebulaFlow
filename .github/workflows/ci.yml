# NebulaFlow CI/CD —— push/PR 触发
# 流水线：Lint → Unit Test → Frontend Build → Deploy (tar.gz over SSH)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -cover ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Frontend build
        working-directory: web-next
        run: |
          npm ci
          npm run build

      - name: Package frontend
        run: tar -czf frontend.tar.gz -C web-next/dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend.tar.gz
          retention-days: 7

  deploy:
    name: Deploy (ssh)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Build frontend
        working-directory: web-next
        run: |
          npm ci
          npm run build

      - name: Create tarball
        run: tar -czf frontend.tar.gz -C web-next/dist .

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: frontend.tar.gz
          target: /tmp

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            mkdir -p /var/www/nebula
            tar -xzf /tmp/frontend.tar.gz -C /var/www/nebula
            rm /tmp/frontend.tar.gz
            nginx -t && nginx -s reload
            echo "deploy ok"
